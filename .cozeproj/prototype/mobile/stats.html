<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1, maximum-scale=1" />

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-primary:              #9AA5B1;
      --color-primary-container:    #D4D9DE;
      --color-on-primary:           #FFFFFF;
      --color-background:                 #F0EDE8;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #F7F5F2;
      --color-surface-container:          #EBE8E3;
      --color-surface-container-high:     #E2DED8;
      --color-surface-container-highest:  #D8D3CC;
      --color-on-surface:           #3D3B38;
      --color-on-surface-variant:   #8A8680;
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      --color-outline:          #C4BFB8;
      --color-outline-variant:  #DDD8D2;
      --radius-sm:   0.5rem;
      --radius-md:   0.75rem;
      --radius-lg:   1rem;
      --radius-xl:   1.25rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      --shadow-card:   0 4px 12px rgba(0,0,0,0.06);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.08);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.12);
      --font-sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
  </style>

  <style>
    body { min-height: max(812px, 100dvh); font-family: system-ui, sans-serif; }
    .pie-chart { width: 180px; height: 180px; border-radius: 50%;
      background: conic-gradient(
        #9AA5B1 0deg 136.8deg,
        #C4B8A8 136.8deg 241.2deg,
        #B8C4A8 241.2deg 313.2deg,
        #D4C4B8 313.2deg 360deg
      );
      position: relative;
    }
    .pie-chart::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 110px; height: 110px; background: #F7F5F2; border-radius: 50%;
    }
  </style>

  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- 二级页Header -->
  <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-between px-4">

    </button>
    <h1 class="text-base font-semibold text-on-surface">支出统计</h1>
    <div class="w-10"></div>
  </header>

  <main class="flex-1">

            </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-3 h-3 rounded-full" style="background:#D4C4B8"></div>
              <span class="text-sm text-on-surface">其他</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold text-on-surface">¥600</span>

        </div>
      </div>
    </div>

    <!-- 视图二：明细列表 -->
    <div id="view-list" class="px-4 hidden">
      <div class="bg-surface rounded-2xl shadow-card p-4">
        <!-- 03月15日 -->
        <div class="mb-4">
          <p class="text-xs text-on-surface-variant mb-2 font-medium">03月15日</p>
          <div class="flex flex-col gap-3">
            <div class="flex items-center justify-between py-2 border-b border-outline-variant/10">

        <!-- 03月16日 -->

          <div class="flex flex-col gap-3">
            <div class="flex items-center justify-between py-2 border-b border-outline-variant/10">
              <div class="flex items-center gap-3">

                </div>

              </div>

            </div>
            <div class="flex items-center justify-between py-2 border-b border-outline-variant/10">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background:rgba(196,184,168,0.2)">
                  <i data-lucide="utensils" class="w-4 h-4" style="color:#C4B8A8"></i>
                </div>
                <div>
                  <p class="text-sm font-medium text-on-surface">腊排骨火锅</p>

                </div>

            </div>
            <div class="flex items-center justify-between py-2">
              <div class="flex items-center gap-3">

                  <i data-lucide="car" class="w-4 h-4 text-primary"></i>
                </div>
                <div>
                  <p class="text-sm font-medium text-on-surface">包车</p>

              </div>

          </div>
        </div>
        <!-- 03月17日 -->
        <div>
          <p class="text-xs text-on-surface-variant mb-2 font-medium">03月17日</p>
          <div class="flex flex-col gap-3">
            <div class="flex items-center justify-between py-2 border-b border-outline-variant/10">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background:rgba(196,184,168,0.2)">
                  <i data-lucide="utensils" class="w-4 h-4" style="color:#C4B8A8"></i>
                </div>
                <div>
                  <p class="text-sm font-medium text-on-surface">午餐</p>
                  <p class="text-xs text-on-surface-variant">餐饮 · 小明</p>
                </div>
              </div>

            <div class="flex items-center justify-between py-2">
              <div class="flex items-center gap-3">

                  <i data-lucide="package" class="w-4 h-4" style="color:#D4C4B8"></i>
                </div>
                <div>
                  <p class="text-sm font-medium text-on-surface">纪念品</p>

    <div class="h-24"></div>

  <!-- 底部切换栏 -->
  <div class="fixed bottom-0 left-0 right-0 z-40 bg-surface border-t border-outline-variant/20 px-6 py-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))]">
    <div class="flex items-center bg-surface-container rounded-xl p-1">
      <button id="tab-chart" class="flex-1 py-2 rounded-lg text-sm font-medium bg-primary text-on-primary transition-colors">
        <i data-lucide="pie-chart" class="w-4 h-4 inline mr-1"></i>图表
      </button>
      <button id="tab-list" class="flex-1 py-2 rounded-lg text-sm font-medium text-on-surface-variant transition-colors">
        <i data-lucide="list" class="w-4 h-4 inline mr-1"></i>明细
      </button>
    </div>
  </div>

  <script>
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }
    function navBack() {
      console.log(`[原型演示] BACK 返回上一页`);
      if(window.history.length > 1) window.history.back();
    }

    $(function() {
      $('#btn-back').on('click', function() { navBack(); });

      $('#tab-chart').on('click', function() {
        $('#view-chart').show();
        $('#view-list').hide();
        $('#tab-chart').addClass('bg-primary text-on-primary').removeClass('text-on-surface-variant');
        $('#tab-list').removeClass('bg-primary text-on-primary').addClass('text-on-surface-variant');
        lucide.createIcons();
      });

      $('#tab-list').on('click', function() {
        $('#view-chart').hide();
        $('#view-list').show();
        $('#tab-list').addClass('bg-primary text-on-primary').removeClass('text-on-surface-variant');
        $('#tab-chart').removeClass('bg-primary text-on-primary').addClass('text-on-surface-variant');
        lucide.createIcons();
      });
    });
  </script>
  <script>lucide.createIcons();</script>
</body>

</html>
